apiVersion: v1
kind: ConfigMap
metadata:
  name: knowledgeops-config
  namespace: default
data:
  LOG_LEVEL: "INFO"
  DATABASE_POOL_SIZE: "10"
  EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "50"
  VECTOR_STORE_TYPE: "pgvector"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgeops-backend
  namespace: default
  labels:
    app: knowledgeops
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledgeops
      component: backend
  template:
    metadata:
      labels:
        app: knowledgeops
        component: backend
    spec:
      containers:
      - name: knowledgeops
        image: knowledgeops:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8100
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: knowledgeops-secrets
              key: database-url
        - name: PGVECTOR_HOST
          value: "postgresql.default.svc.cluster.local"
        - name: PGVECTOR_PORT
          value: "5432"
        - name: PGVECTOR_DATABASE
          value: "knowledgeops"
        - name: PGVECTOR_USER
          valueFrom:
            secretKeyRef:
              name: knowledgeops-secrets
              key: pgvector-user
        - name: PGVECTOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: knowledgeops-secrets
              key: pgvector-password
        envFrom:
        - configMapRef:
            name: knowledgeops-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: cache
          mountPath: /app/cache
      volumes:
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: knowledgeops-backend
  namespace: default
  labels:
    app: knowledgeops
    component: backend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8100
    targetPort: 8100
    protocol: TCP
  selector:
    app: knowledgeops
    component: backend
