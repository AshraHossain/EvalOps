[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalops-backend"
version = "0.1.0"
description = "EvalOps — AI evaluation, reliability & observability backend"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Ashrafuzzaman Hossain" }]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.1",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.13.2",
    "redis==5.0.8",
    "httpx==0.27.2",
    "python-json-logger==2.0.7",
    "clickhouse-connect==0.7.19",
    "ragas==0.2.12",
    "deepeval==1.1.4",
    "prometheus-client==0.21.1",
    "aiosqlite==0.22.1",
    "networkx>=3.0,<4",
    "jinja2>=3.1,<4",
]

[project.urls]
Repository = "https://github.com/AshraHossain/EvalOps.git"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
