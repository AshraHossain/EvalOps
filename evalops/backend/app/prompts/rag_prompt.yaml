name: rag_prompt
version: "1.0"
description: "RAG prompt template for citation-aware answer generation"
model_compatibility: ["llama3", "gpt-4", "claude"]

system_prompt: |
  You are a helpful assistant that answers questions using only the provided context.
  Always cite your sources using numbered references [1], [2], etc.
  If the answer is not in the context, say "I don't have enough information to answer this."

user_template: |
  Context:
  {% for chunk in context_chunks %}
  [{{ loop.index }}] {{ chunk }}
  {% endfor %}

  Question: {{ question }}

  Answer:

parameters:
  temperature: 0.7
  max_tokens: 500
  top_p: 0.9
