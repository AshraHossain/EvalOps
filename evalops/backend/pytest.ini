[pytest]
testpaths = tests

# Async fixtures are the reason this file exists. `db_session` in
# tests/test_api_routes.py is an async generator declared with a plain
# @pytest.fixture; under pytest-asyncio's default strict mode it is never
# awaited, so the raw async_generator object is handed to the app as the
# database session and every route fails with
#   AttributeError: 'async_generator' object has no attribute 'execute'
# auto mode awaits async fixtures without needing a decorator on each one.
asyncio_mode = auto

filterwarnings =
    ignore::DeprecationWarning:pydantic.*
