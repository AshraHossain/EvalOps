apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalops-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evalops-backend
  template:
    metadata:
      labels:
        app: evalops-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/evalops-backend:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: evalops-backend
spec:
  selector:
    app: evalops-backend
  ports:
    - port: 80
      targetPort: 8000
