name: backend-ci
on:
  pull_request:
    paths:
      - "evalops/backend/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r evalops/backend/requirements.txt
      - run: python -m compileall evalops/backend/app
      - run: python -m pytest evalops/backend/tests -q
