name: knowledgeops-ci
on:
  push:
    branches: [main, master]
    paths:
      - "knowledgeops/backend/**"
      - ".github/workflows/knowledgeops-ci.yml"
  pull_request:
    paths:
      - "knowledgeops/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd knowledgeops/backend
          uv sync
          uv pip install pytest-cov

      - name: Lint with compile check
        run: |
          cd knowledgeops/backend
          uv run python -m compileall app

      - name: Run tests with coverage
        run: |
          cd knowledgeops/backend
          uv run pytest tests -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./knowledgeops/backend/coverage.xml
          flags: knowledgeops-unittests
          name: codecov-knowledgeops
          fail_ci_if_error: false
        continue-on-error: true
