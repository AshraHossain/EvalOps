name: knowledgeops-ci
on:
  push:
    branches: [main, master]
    paths:
      - "knowledgeops/backend/**"
      - ".github/workflows/knowledgeops-ci.yml"
  pull_request:
    paths:
      - "knowledgeops/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r knowledgeops/backend/requirements.txt
          pip install pytest-cov

      - name: Lint with compile check
        run: python -m compileall knowledgeops/backend/app

      - name: Run tests with coverage
        run: |
          cd knowledgeops/backend
          python -m pytest tests -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./knowledgeops/backend/coverage.xml
          flags: knowledgeops-unittests
          name: codecov-knowledgeops
          fail_ci_if_error: false
        continue-on-error: true
